<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Form</title>
</head>

<body>
    <div class="container">
        <div class="form-image">
            <img src="assets/img/undraw_shopping_re_3wst.svg" alt="">
        </div>
        
        <div class="form">
            <form action="#">
                <div class="form-header">
                    <div class="title">
                        <h1>Register</h1>
                    </div>
                    <div class ="login-button">
                        <button><a href="#">Login</a></button>
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-box">
                        <label for="firstname">First Name</label>
                        <input id="firstname" type="text" name="firstname" placeholder="Enter your first name" required>
                </div>
                <div class="input-box">
                        <label for="lastname">Last Name</label>
                        <input id="lastname" type="text" name="lastname" placeholder="Enter your last name" required>
                </div>
                <div class="input-box">
                        <label for="email">Email</label>
                        <input id="email" type="text" name="email" placeholder="Enter your email" required>
                </div>
                <div class="input-box">
                        <label for="number">Telephone</label>
                        <input id="number" type="tel" name="number" placeholder="+44 xxxx xxxxxx" required>
                </div>
                <div class="input-box">
                        <label for="password">Password</label>
                        <input id="password" type="password" name="password" placeholder="Enter your password" required>    
                </div>
                <div class="input-box">
                        <label for="confirmpassword">Confirm Password</label>
                        <input id="confirmpassword" type="password" name="confirmpassword" placeholder="Confirm your password" required>
                    </div>
                </div>

                <div class="gender-inputs">
                    <div class="gender-title">
                        <h6>Gender</h6>
                    </div>

                    <div class="gender-group">
                        <div class="gender-input">
                            <input type="radio" id="female" name="gender">
                            <label for="female">Female</label>      
                            </div>
                             <div class="gender-input">
                            <input type="radio" id="male" name="gender">
                            <label for="female">Male</label>      
                            </div>
                             <div class="gender-input">
                            <input type="radio" id="others" name="gender">
                            <label for="none">I pefer not to say</label>      
                         </div>
                    </div>
                </div>

                <div class="continue-button">
                    <button><a href="#">Continue</a></button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
